version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourPassword123
      POSTGRES_DB: news_sentiment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  airflow-webserver:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:YourPassword123@postgres/news_sentiment
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project
    ports:
      - "8080:8080"
    command: webserver
  airflow-init:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:YourPassword123@postgres/news_sentiment
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      # Admin user creation
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com

      # Needed for DockerOperator
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
  airflow-scheduler:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:YourPassword123@postgres/news_sentiment
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

      # DockerOperator support
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project
    command: scheduler
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-news
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-news:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  
  kafka-producer:
    build: ./services/kafka-producer
    container_name: kafka-producer
    depends_on:
      - kafka
    volumes:
      - ./data:/data
  
  spark-job:
    build: ./services/spark-job
    depends_on:
     - kafka
    volumes:
     - ./results:/results
    environment:
     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  nifi:
    image: apache/nifi:latest
    container_name: nifi-news
    ports:
      - "8443:8080"
    environment:
      NIFI_WEB_HTTP_PORT: 8080

  spark:
    image: spark:latest
    container_name: spark-news
    ports:
      - "8888:8888"
      - "7077:7077"
    environment:
      SPARK_MODE: master

  python-app:
    env_file:
      - .env
    build:
      context: ./services/python-app
    container_name: python-news
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./data:/data
      - ./results:/results
      - ./logs:/logs
    environment:
      POSTGRES_HOST: postgres-news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newsSentiment
      POSTGRES_DB: news_sentiment
      KAFKA_BOOTSTRAP_SERVERS: kafka-news:9092
    command: python batch_pipeline.py

volumes:
  postgres_data:
